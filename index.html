<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bagre Royale • Histórico de Ligas</title>
    <meta name="theme-color" content="#070b18" />
    <link rel="icon" href="assets/navbar/bagre-ico.webp" sizes="any" />
    <link rel="apple-touch-icon" href="assets/navbar/bagre-ico.webp" />
    <link
      rel="preload"
      href="assets/Supercell-Magic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />

    <link rel="prefetch" href="season.html" />
    <link rel="prefetch" href="copa-bagre.html" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-wrap">

        <a href="index.html" class="brand" aria-label="Bagre Royale">
          <img
            src="assets/navbar/bagre-nt.png"
            alt="Ícone Bagre Royale"
            class="brand-icon"
            width="60"
            height="60"
          />
          <span class="brand-text">Bagre<br>Royale</span>
        </a>

        <div class="header-actions">
          <a href="bagres/bagres.html" aria-label="Cardume de Bagres">
            <img
              src="assets/navbar/cardume-btn.webp"
              alt=""
              width="50"
              height="50"
              loading="lazy"
              decoding="async"
            />
          </a>

          <a href="awards/awards.html" aria-label="awards">
            <img
              src="assets/navbar/bet-btn.webp"
              alt=""
              width="50"
              height="50"
              loading="lazy"
              decoding="async"
            />
          </a>

          <a
            href="https://www.instagram.com/bagreroyale/"
            target="_blank"
            rel="noopener"
            aria-label="Nosso Instagram"
          >
            <img
              src="assets/navbar/insta-btn.webp"
              alt=""
              width="50"
              height="50"
              loading="lazy"
              decoding="async"
            />
          </a>
        </div>
      </div>
    </header>

    <main id="root">
      <section class="hero">
        <div class="container hero-wrap">
          <div>
            <h1 class="hero-title">Seja Bem-Vindo ao Bagre Royale!</h1>
            <p class="hero-subtitle">
              Acompanhe os resultados do Bagreleirão e de todos os torneios.
              Confira as estatísticas dos bagres!
            </p>
          </div>
        </div>
      </section>

      <section class="container section">
        <div class="section-head">
          <h2 class="section-title">Torneios</h2>
        </div>
        <div id="carousel-copa" class="carousel" aria-live="polite"></div>
      </section>

      <section class="container section">
        <div class="section-head">
          <h2 class="section-title">Bagreleirão - SÉRIE A</h2>
        </div>
        <div
          id="carousel-bagreleirao-a"
          class="carousel"
          aria-live="polite"
        ></div>
      </section>

      <section class="container section">
        <div class="section-head">
          <h2 class="section-title">Bagreleirão - SÉRIE B</h2>
        </div>
        <div
          id="carousel-bagreleirao-b"
          class="carousel"
          aria-live="polite"
        ></div>
      </section>

      <section class="container section">
        <div class="section-head">
          <h2 class="section-title">Campeonatos</h2>
        </div>
        <div id="carousel" class="carousel" aria-live="polite"></div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <small>© <span id="year"></span> Bagre Royale</small>
        <img
          src="assets/navbar/logo-dev-horizontal.webp"
          alt="Logo Dev"
          class="footer-dev-logo"
          loading="lazy"
          decoding="async"
        />
      </div>
    </footer>
    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script src="main.js"></script>
  </body>
</html>
